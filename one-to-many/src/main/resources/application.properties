# TODO: Change the application name to match your project
spring.application.name=one-to-many

# H2 in-memory database (replace with your DB config for production)
spring.datasource.url=jdbc:h2:mem:onetomanydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console -- accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load data.sql after JPA creates the schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
